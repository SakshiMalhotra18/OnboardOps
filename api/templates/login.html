<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnboardOps | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --text: #0f172a;
            --text-muted: #475569;
            --text-soft: #64748b;
            --accent: #1a73e8;
            --accent-dim: rgba(26,115,232,0.12);
            --font-body: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;
            --radius: 12px;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 15% 50%, rgba(26, 115, 232, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(52, 168, 83, 0.05), transparent 25%);
            z-index: -1;
            animation: meshFloat 20s infinite alternate linear;
        }

        @keyframes meshFloat {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .logo span { color: var(--accent); }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .login-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1rem;
            text-decoration: none;
        }

        .login-btn:hover {
            background: var(--surface-hover);
            transform: translateY(-2px);
            border-color: var(--border-strong);
        }

        .login-btn.manager {
            background: rgba(167, 139, 250, 0.1);
            border-color: rgba(167, 139, 250, 0.2);
        }

        .login-btn.manager:hover {
            background: rgba(167, 139, 250, 0.2);
        }

        .login-btn.employee {
            background: var(--accent-dim);
            border-color: rgba(56, 189, 248, 0.2);
        }

        .login-btn.employee:hover {
            background: rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">Onboard<span>Ops</span></div>
        <p class="subtitle">Select a persona to enter the platform</p>

        <a href="/auth/login?employee_id=M1&role=manager" class="login-btn manager" style="display:block; text-decoration:none; box-sizing:border-box;">
            Login as Manager (Priya Patel)
        </a>

        <a href="/auth/login?employee_id=E1&role=employee" class="login-btn employee" style="display:block; text-decoration:none; box-sizing:border-box;">
            Login as Employee (Alex Smith)
        </a>
    </div>

</body>
</html>
